name: validate-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-title:  # This matches 'validate-title'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title includes "feature"
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "Title: $TITLE"
          if [[ "$TITLE" =~ [Dd]ev[Oo]ps[[:space:]]+[Cc]enter ]]; then
            echo "✅ Title is valid"
          else
            echo "❌ Title must include the word 'feature'"
            exit 1
          fi

