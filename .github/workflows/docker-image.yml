name: Validate PR Before Merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Example: Fail if PR title doesn't follow convention
      - name: Check PR title
        run: |
          echo "PR title: ${{ github.event.pull_request.title }}"
          if [[ ! "${{ github.event.pull_request.title }}" =~ ^(feat|fix|chore|docs|test|refactor)\: ]]; then
            echo "❌ PR title must start with 'feat:', 'fix:', 'chore:', etc."
            exit 1
          fi

      # Add more validation as needed (linting, test coverage, etc.)
