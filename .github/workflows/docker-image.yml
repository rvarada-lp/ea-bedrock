name: validate-title

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate-title:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PR title contains 'Feature'
        run: |
          echo "Checking PR title: ${{ github.event.pull_request.title }}"
          if [[ ! "${{ github.event.pull_request.title }}" =~ [Ff]eature ]]; then
            echo "::error title=Invalid PR Title::PR title must contain the word 'Feature'"
            exit 1
          fi
 
